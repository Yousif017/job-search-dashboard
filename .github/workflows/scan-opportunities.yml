
name: Weekly opportunity scan

on:
  schedule:
    - cron: "0 6 * * 1"  # every Monday at 06:00 UTC
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run opportunity scan
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/scan-opportunities.js

      - name: Commit updated suggestions.json
        run: |
          git config user.name "opportunity-scan-bot"
          git config user.email "actions@github.com"
          git add suggestions.json
          git diff --cached --quiet || git commit -m "Automated opportunity scan update"
          git push
